name: Deploy fix-swipe preview

on:
  push:
    branches: [fix-swipe]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Check out preview branch
        uses: actions/checkout@v4
        with:
          ref: fix-swipe
          path: preview

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            preview/package-lock.json

      - name: Build production from main
        working-directory: production
        run: |
          npm ci
          npm run build

      - name: Build fix-swipe preview
        working-directory: preview
        run: |
          npm ci
          npm run build -- --base=/heli-interactive-art-portfolio/previews/fix-swipe/

      - name: Add preview to production artifact
        run: |
          preview_root="production/dist/previews/fix-swipe"
          mkdir -p "$preview_root"
          cp -R preview/dist/. "$preview_root/"

          for route in creating-process puzzle-room artwork-detail; do
            mkdir -p "$preview_root/$route"
            cp preview/dist/index.html "$preview_root/$route/index.html"
          done

          sed -n 's/^[[:space:]]*id: "\([^"]*\)".*/\1/p' preview/src/data/artworks.js |
          while IFS= read -r artwork_id; do
            mkdir -p "$preview_root/artwork/$artwork_id"
            cp preview/dist/index.html "$preview_root/artwork/$artwork_id/index.html"
          done

          cp production/dist/index.html production/dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: production/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}previews/fix-swipe/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
